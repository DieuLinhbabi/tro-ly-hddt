# Giữ trang Trợ lý Hóa đơn điện tử luôn thức trên Streamlit Cloud.
# Cứ khoảng 4 tiếng GitHub mở trang một lần bằng trình duyệt Chrome có sẵn trên máy của GitHub (miễn phí với repo công khai).
name: Giữ web luôn thức

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:   # cho phép bấm chạy tay trong tab Actions

jobs:
  mo-trang:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Cài thư viện mở trình duyệt
        run: pip install playwright==1.55.0
      - name: Mở trang trợ lý
        run: python .github/giu_thuc.py
